<!doctype html>
<!-- Social preview card (1280x640). One template for all four Zero to Hero sites
     (cloud / data / security / ai .noblerworks.com) - change all four together.
     Render: serve this folder over http and screenshot at 1280x640 into
     social-preview-1280x640.png (headless Chromium or Playwright). No counts on the
     card: a number baked into an image is a number nothing checks. -->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000}
  .card{width:1280px;height:640px;box-sizing:border-box;padding:0 84px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse 620px 420px at 100% 0%, rgba(34,197,94,0.22), transparent 70%), #000;
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:#fff}
  .kicker{position:absolute;top:112px;font-family:"DejaVu Sans Mono",monospace;font-size:24px;letter-spacing:6px;color:#22c55e;font-weight:700}
  h1{position:absolute;top:150px;margin:0;font-size:92px;line-height:1.02;font-weight:800;letter-spacing:-2px}
  h1 .a{color:#22c55e}
  .sub{position:absolute;top:372px;font-size:30px;color:#a3a3a3}
  .rule{position:absolute;top:436px;width:112px;height:4px;background:#22c55e;border-radius:2px}
  .chips{position:absolute;top:474px;display:flex;gap:14px}
  .chip{border:1px solid #333;border-radius:28px;padding:12px 22px;font-size:20px;font-weight:700;background:#0a0a0a}
  .url{position:absolute;bottom:52px;font-family:"DejaVu Sans Mono",monospace;font-size:19px;color:#a3a3a3}
  .brand{position:absolute;bottom:52px;right:84px;font-family:"DejaVu Sans Mono",monospace;font-size:19px;color:#666}
</style></head>
<body><div class="card">
  <div class="kicker">FREE &amp; OPEN SOURCE</div>
  <h1>Cloud, from zero<br><span class="a">to hero</span></h1>
  <div class="sub">AWS, Azure, GCP, Kubernetes, DevOps. Free.</div>
  <div class="rule"></div>
  <div class="chips"><div class="chip">Learn</div><div class="chip">Build</div><div class="chip">Certify</div><div class="chip">Reference</div></div>
  <div class="url">cloud.noblerworks.com</div>
  <div class="brand">Nobler Works</div>
</div></body></html>
