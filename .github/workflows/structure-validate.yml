name: Structure and frontmatter validate

on:
  push:
    branches: [main]
    paths:
      - 'exams/**'
      - 'docs/certs.json'
      - 'README.md'
      - 'STUDY-HUB.md'
      - 'learn/**'
      - 'topics/**'
      - 'resources/**'
      - '.github/scripts/validate-cert-structure.sh'
      - '.github/scripts/validate-frontmatter.sh'
      - '.github/scripts/build-freshness-ledger.sh'
      - '.github/scripts/build-certs-index.py'
      - '.github/scripts/build-provider-indexes.py'
      - '.github/scripts/build-lab-map.py'
      - '.github/scripts/build-flashcards.py'
      - '.github/scripts/check-readme-counts.py'
  pull_request:
    paths:
      - 'exams/**'
      - 'docs/certs.json'
      - 'README.md'
      - 'STUDY-HUB.md'
      - 'learn/**'
      - 'topics/**'
      - 'resources/**'
      - '.github/scripts/validate-cert-structure.sh'
      - '.github/scripts/validate-frontmatter.sh'
      - '.github/scripts/build-freshness-ledger.sh'
      - '.github/scripts/build-certs-index.py'
      - '.github/scripts/build-provider-indexes.py'
      - '.github/scripts/build-lab-map.py'
      - '.github/scripts/build-flashcards.py'
      - '.github/scripts/check-readme-counts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run structure validator
        run: bash .github/scripts/validate-cert-structure.sh

      - name: Run frontmatter validator
        run: bash .github/scripts/validate-frontmatter.sh

      # certs.json is the source of truth for every generated count and table.
      # If a cert was added, renamed, or had its fact-sheet edited without
      # regenerating, these fail with the command to run.
      - name: Check cert index is current
        run: python3 .github/scripts/build-certs-index.py --check

      - name: Check generated navigation is current
        run: python3 .github/scripts/build-provider-indexes.py --check

      - name: Check lab-to-cert map is current
        run: python3 .github/scripts/build-lab-map.py --check

      - name: Check flashcard decks are current
        run: python3 .github/scripts/build-flashcards.py --check

      # The README advertises counts that are not derived from certs.json -
      # concept pages, topic indexes, comparisons, word count. Those drifted
      # unnoticed (37 vs 46 concept pages) until this check existed.
      # Fix with: python3 .github/scripts/check-readme-counts.py --fix
      - name: Check README counts match the tree
        run: python3 .github/scripts/check-readme-counts.py --check

      # Advisory: reports which cert guides are due for re-verification this month.
      - name: Cert freshness rotation (advisory)
        continue-on-error: true
        run: python3 .github/scripts/check-cert-freshness.py

      # Advisory, never blocking. Orphan detection is a heuristic: some pages are
      # legitimately reachable only through a directory listing, so a hit is a prompt
      # to look, not a failure.
      - name: Report orphaned pages (advisory)
        continue-on-error: true
        run: bash .github/scripts/check-orphan-links.sh

      - name: Build freshness ledger (preview)
        run: bash .github/scripts/build-freshness-ledger.sh > /tmp/freshness.preview.md && head -40 /tmp/freshness.preview.md
