# MkDocs Material configuration for the published site.
#
# The `nav` key is deliberately absent. `.github/scripts/build-site.py` stages the
# markdown tree into `.site-src/`, generates the navigation from the tree and from
# `docs/certs.json`, appends it to a copy of this file as `mkdocs.generated.yml`,
# and builds from that. Editing `nav` here would be overwritten, so edit the
# generator instead.
#
# Everything else in this file is hand-maintained. Build with:
#   .venv-docs/bin/python .github/scripts/build-site.py --strict

site_name: Cloud, Data, AI, and Security - Zero to Hero
site_description: >-
  Plain-English concepts, hands-on builds, deep references, and the most
  comprehensive certification library on GitHub. Cloud, data, AI, and security
  from absolute zero.
site_author: Patrick Wiloak
site_url: https://patrickwiloak.github.io/cloud-data-ai-security-zero-to-hero/

repo_url: https://github.com/PatrickWiloak/cloud-data-ai-security-zero-to-hero
repo_name: cloud-data-ai-security-zero-to-hero
edit_uri: edit/main/

copyright: >-
  Built by <a href="https://patrickwiloak.com">Patrick Wiloak</a> at
  <a href="https://noblerworks.com/">Nobler Works</a>. Free for educational use.

# Generated by build-site.py. Never edit .site-src/ by hand.
docs_dir: .site-src
site_dir: site

theme:
  name: material
  language: en
  # Overrides one Material partial so that toc.integrate also works on
  # section-index pages. See .github/site-overrides/partials/nav-item.html and
  # docs/ARCHITECTURE.md. Kept out of .github/site/, which holds site chrome
  # (the stylesheet and the landing-page template) rather than templates.
  custom_dir: .github/site-overrides
  icon:
    repo: fontawesome/brands/github
    # Material's stock mark is a book, which says "documentation" and nothing
    # about this site. A rocket reads as ascent, which is the distinctive half
    # of "Zero to Hero", and stays legible as a silhouette at 24px - where the
    # four-emoji lockup from the README would turn to mush.
    logo: material/rocket-launch-outline
  features:
    # Deliberately NOT navigation.tabs. With tabs, the left sidebar shows only the
    # active tab's subtree, so Home - a root page with no children - rendered an
    # almost empty left column while a cert page rendered a deep one. The sidebar
    # changed shape depending on where you were. Without tabs it is the same full
    # site tree on every page, with the current branch expanded.
    - navigation.sections
    # A directory's README.md becomes the landing page for its nav section
    # instead of a redundant child entry.
    - navigation.indexes
    # The cert library is ~1,700 nav entries. Without pruning, every one of them
    # is inlined into all 1,900 pages and the built site balloons past a
    # gigabyte. Pruning emits only the branch around the current page.
    - navigation.prune
    - navigation.top
    - navigation.footer
    # Keep the sidebar scrolled to wherever you are in the tree, and the URL in
    # step with the section being read.
    - navigation.tracking
    # One sidebar, always on the left: the page's table of contents folds into
    # the navigation instead of claiming a second column on the right. Upstream
    # this drops the ToC on section-index pages; the custom_dir override above
    # restores it.
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
  palette:
    # Monochrome, matching Nobler Works house style. `custom` opts out of
    # Material's built-in colour palettes entirely; the actual black and white
    # values are defined in .github/site/extra.css under the scheme selectors.
    # All three entries need it - this first one is what renders before the
    # palette JS runs, so omitting it here shows Material's default indigo.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
      # Match GitHub's heading-slug algorithm exactly. The repo's ~960 anchor
      # links were written against GitHub's rendering, where "Security &
      # Identity" becomes "#security--identity" and a leading emoji leaves a
      # leading hyphen. Python-Markdown's default slugifier collapses both,
      # which would silently break those links on the site only.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # No `linenums` / `line_spans` / `anchor_linenums`: no page in the repo uses
  # line numbering or line highlighting, and the per-line <span> markup they emit
  # inflates the built site by roughly a third across 5,700 code blocks.
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.saneheaders
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Link integrity is already enforced against the source tree by
# .github/scripts/check-internal-links.py. These settings catch the cases that
# only appear once the tree is rendered: links to files outside the site, and
# anchors that do not exist on the target page.
validation:
  omitted_files: info
  not_found: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PatrickWiloak/cloud-data-ai-security-zero-to-hero
      name: This repository on GitHub
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@patrickwiloak
      name: Patrick Wiloak on YouTube
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/patricklukewilson/
      name: Patrick Wiloak on LinkedIn
    - icon: fontawesome/solid/globe
      link: https://noblerworks.com/
      name: Nobler Works

extra_css:
  - assets/site/extra.css
